# Nginx config — VPS Hostinger KVM2
# Copie para /etc/nginx/sites-available/sistema-motel
# ln -s /etc/nginx/sites-available/sistema-motel /etc/nginx/sites-enabled/
# Substitua SEU_DOMINIO pelo domínio real antes de usar

upstream nextjs_app {
    server 127.0.0.1:3000;
    keepalive 64;
}

# Redireciona HTTP → HTTPS
server {
    listen 80;
    server_name SEU_DOMINIO www.SEU_DOMINIO;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name SEU_DOMINIO www.SEU_DOMINIO;

    # Certificado Let's Encrypt (certbot preenche automaticamente)
    ssl_certificate /etc/letsencrypt/live/SEU_DOMINIO/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/SEU_DOMINIO/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Tamanho máximo de upload (imagens, documentos)
    client_max_body_size 20M;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Socket.IO — WebSocket upgrade
    location /socket.io/ {
        proxy_pass http://nextjs_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # Restante da aplicação Next.js
    location / {
        proxy_pass http://nextjs_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60;
    }
}
